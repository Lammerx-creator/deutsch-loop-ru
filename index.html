<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ef">
  <meta name="description" content="DeutschLoop RU — немецкий с памятью об ошибках. Русские объяснения, интервальные повторения, бытовые диалоги и личный словарь. Прогресс хранится в вашем браузере.">
  <title>DeutschLoop RU — немецкий с памятью</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script defer src="content.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">К содержимому</a>
  <div class="app-shell">
    <aside class="app-sidebar" aria-label="Навигация тренажёра">
      <a class="brand" href="./" aria-label="DeutschLoop RU — на главную">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M8 7c0 9 16 9 16 18M24 7c0 9-16 9-16 18" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M9 9h14M12 14h8M12 20h8M9 25h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">DeutschLoop<span class="brand-lang">RU</span></span>
      </a>
      <p class="sidebar-tagline">Немецкий с памятью<br>об ошибках</p>
      <div class="nav-caption">ВАША ПРАКТИКА</div>
      <nav class="app-nav" aria-label="Основная навигация">
        <button class="nav-btn active" type="button" data-view="overview" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.8"/></svg>
          <span>Обзор</span>
        </button>
        <button class="nav-btn" type="button" data-view="practice">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 3-9 11h6l-1 7 9-11h-6l1-7Z" stroke-linejoin="round"/></svg>
          <span>Тренировка</span>
        </button>
        <button class="nav-btn" type="button" data-view="dna">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3c0 8 12 10 12 18M18 3c0 8-12 10-12 18M7 5h10M9 10h6M9 15h6M7 20h10" stroke-linecap="round"/></svg>
          <span>Мои ошибки</span>
        </button>
        <button class="nav-btn" type="button" data-view="scenarios">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 11a7.5 7.5 0 0 1-7.5 7.5H7l-4 3v-8A7.5 7.5 0 1 1 20.5 11Z" stroke-linejoin="round"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01" stroke-linecap="round" stroke-width="3"/></svg>
          <span>Диалоги</span>
        </button>
        <button class="nav-btn" type="button" data-view="words">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H4V4ZM20 4h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-3h3V4Z" stroke-linejoin="round"/></svg>
          <span>Слова</span>
        </button>
        <button class="nav-btn" type="button" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3.5"/><path d="M4 5.5v6c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5v-6M4 11.5v6c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5v-6"/></svg>
          <span>Данные</span>
        </button>
      </nav>
      <div class="sidebar-note">
        <span class="privacy-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 4 6v6c0 4.5 8 9 8 9s8-4.5 8-9V6l-8-3Z" stroke-linejoin="round"/><path d="m8.5 11.5 2.5 2.5 4.5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <p><strong>Ваш прогресс — у вас</strong><br>Данные хранятся в этом браузере.</p>
      </div>
    </aside>
    <div class="workspace">
      <main id="app" class="app-main" tabindex="-1">
        <div class="initial-loading" role="status">Готовим вашу практику…</div>
        <noscript><div class="notice">Для работы тренажёра включите JavaScript в браузере.</div></noscript>
      </main>
      <footer class="app-footer">
        <span>DeutschLoop RU · Учитесь на своих ошибках.</span>
        <span>На основе <a href="https://github.com/ahmtsahin/deutsch-loop" target="_blank" rel="noopener noreferrer">DeutschLoop · Ahmet Sahin</a> · MIT</span>
      </footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
